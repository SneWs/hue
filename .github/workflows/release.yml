name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOFLAGS: -buildvcs=false
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/hue-linux-${{ matrix.arch }}" ./cmd/hue

      - uses: actions/upload-artifact@v4
        with:
          name: hue-linux-${{ matrix.arch }}
          path: dist/hue-linux-${{ matrix.arch }}

  publish:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: hue-linux-*
          merge-multiple: true
          path: dist

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "refusing to publish ${tag}; pass a version tag such as v1.2.3" >&2
              exit 1
              ;;
          esac

          cd dist
          # With release immutability enabled, this creates a draft, uploads
          # the binaries, and publishes. The release is immutable only after publish.
          gh release create "$tag" \
            --title "$tag" \
            --target "${GITHUB_SHA}" \
            --verify-tag \
            --notes "Built from ${GITHUB_SHA}." \
            hue-linux-amd64 \
            hue-linux-arm64

          immutable=$(gh release view "$tag" --json isImmutable --jq .isImmutable)
          if [ "$immutable" != "true" ]; then
            gh release delete "$tag" --yes --cleanup-tag || true
            echo "refusing ${tag}: GitHub left the release mutable. Enable release immutability, then push the tag again." >&2
            exit 1
          fi

          ok=0
          for _ in 1 2 3 4 5 6; do
            if gh release verify "$tag" \
              && gh release verify-asset "$tag" hue-linux-amd64 \
              && gh release verify-asset "$tag" hue-linux-arm64; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "release ${tag} is immutable but its attestation did not verify" >&2
            exit 1
          fi
