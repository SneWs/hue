name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOFLAGS: -buildvcs=false
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/hue-linux-${{ matrix.arch }}" ./cmd/hue

      - uses: actions/upload-artifact@v4
        with:
          name: hue-linux-${{ matrix.arch }}
          path: dist/hue-linux-${{ matrix.arch }}

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hue-linux-*
          merge-multiple: true
          path: dist

      - name: Publish to the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum hue-linux-amd64 hue-linux-arm64 > SHA256SUMS

          args=(--notes "Built from ${GITHUB_SHA}." --target "${GITHUB_SHA}")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            args+=(--title "${GITHUB_REF_NAME}")
          else
            tag="latest"
            args+=(--title "Latest build" --prerelease)
            gh release delete latest --yes --cleanup-tag || true
          fi

          gh release create "$tag" "${args[@]}" \
            hue-linux-amd64 \
            hue-linux-arm64 \
            SHA256SUMS
